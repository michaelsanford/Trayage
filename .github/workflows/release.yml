name: Release

# Trigger: git tag v1.2.3 on a commit that is on main, then: git push origin v1.2.3
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # v* tags are only released when the tagged commit is on the main branch.
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check tag commit is reachable from main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is on main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} is not on the main branch; refusing to release."
            exit 1
          fi

  build:
    name: Build & Sign (${{ matrix.rid }})
    runs-on: windows-latest
    needs: guard
    permissions:
      id-token: write     # cosign keyless signing + provenance attestation
      attestations: write # actions/attest-build-provenance
      contents: read

    strategy:
      matrix:
        include:
          - rid: win-x64    # amd64
          - rid: win-arm64  # arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.x'

      # RID-agnostic so it can run in locked mode; publish targets one RID below.
      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Publish self-contained (${{ matrix.rid }})
        run: >-
          dotnet publish src/Trayage.App/Trayage.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained
          --no-restore
          --output publish

      # Bake the OAuth identifiers into the shipped config. All three live in repo
      # secrets so forks can't reuse them; note an embedded secret in a desktop app is
      # not truly confidential (see the "OAuth setup" section in README.md).
      - name: Inject OAuth configuration
        shell: pwsh
        env:
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          BITBUCKET_OAUTH_KEY: ${{ secrets.BITBUCKET_OAUTH_KEY }}
          BITBUCKET_OAUTH_SECRET: ${{ secrets.BITBUCKET_OAUTH_SECRET }}
          GITLAB_OAUTH_APP_ID: ${{ secrets.GITLAB_OAUTH_APP_ID }}
        run: |
          $path = "publish/appsettings.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.GitHub.ClientId      = $env:GH_OAUTH_CLIENT_ID
          $json.Bitbucket.Key        = $env:BITBUCKET_OAUTH_KEY
          $json.Bitbucket.Secret     = $env:BITBUCKET_OAUTH_SECRET
          $json.GitLab.ApplicationId = $env:GITLAB_OAUTH_APP_ID
          $json | ConvertTo-Json -Depth 10 | Set-Content $path -Encoding utf8
          Write-Host "Injected OAuth client identifiers into $path"

      - name: Package archive
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "trayage-${{ github.ref_name }}-${{ matrix.rid }}.zip"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: trayage-${{ github.ref_name }}-${{ matrix.rid }}.zip

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign archive with cosign (keyless, GitHub OIDC)
        shell: pwsh
        run: cosign sign-blob --yes "trayage-${{ github.ref_name }}-${{ matrix.rid }}.zip" --bundle "trayage-${{ github.ref_name }}-${{ matrix.rid }}.zip.bundle"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.rid }}
          path: |
            trayage-${{ github.ref_name }}-${{ matrix.rid }}.zip
            trayage-${{ github.ref_name }}-${{ matrix.rid }}.zip.bundle

  sbom:
    name: Generate SBOM
    runs-on: windows-latest
    needs: guard

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.x'

      - name: Generate CycloneDX SBOM
        run: |
          dotnet tool install --global CycloneDX --version 6.3.1
          dotnet-CycloneDX src/Trayage.App/Trayage.App.csproj -o sbom -fn trayage-${{ github.ref_name }}-sbom.cdx.json -F Json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/trayage-${{ github.ref_name }}-sbom.cdx.json

  release:
    name: Create Draft Release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets/
          merge-multiple: true

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            assets/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --draft
